[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    postgres: runs against PostgreSQL when TEST_DATABASE_URL is set
    docker: needs Docker and the sandbox image (skipped otherwise)
    llm: calls a real LLM (opt-in via AGENTFORGE_E2E_LLM)
filterwarnings =
    error::DeprecationWarning:app.*
